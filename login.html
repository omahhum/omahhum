<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 帳號登入</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 設定 Inter 字體 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 主應用程式容器 -->
    <div id="app" class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl transition-all duration-300">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Google 帳號驗證</h1>

        <!-- 登入狀態顯示區塊 -->
        <div id="auth-status" class="space-y-4">
            <!-- 登入按鈕 (預設顯示) -->
            <button id="google-signin-btn" onclick="signInWithGoogle()"
                    class="w-full flex items-center justify-center px-4 py-3 border border-transparent text-sm font-medium rounded-lg shadow-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50 transition duration-150 ease-in-out">
                <svg class="w-5 h-5 mr-3" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M44 24C44 26.5448 43.6826 29.043 43.0564 31.4326H24V16.3636H34.4687C34.9084 18.0673 35.1528 19.8398 35.1528 21.6061C35.1528 22.8447 35.0441 24 34.8258 24H44Z" fill="#4285F4"/>
                    <path d="M24.0001 44.0001C29.3562 44.0001 34.0152 42.2273 37.6087 39.2483L30.1213 33.3712C28.1678 34.6136 26.1154 35.2727 24.0001 35.2727C19.7958 35.2727 16.2736 32.553 14.8837 28.5208L7.14373 34.4091C10.7027 39.5227 16.8911 44.0001 24.0001 44.0001Z" fill="#34A853"/>
                    <path d="M7.14373 13.591C3.58474 18.7046 3.58474 25.2955 7.14373 30.4091L14.8837 24.5208C16.2736 20.4886 19.7958 17.7689 24.0001 17.7689C26.7909 17.7689 29.3562 18.7046 31.3097 20.3636L38.7971 14.4864C34.7212 11.2348 29.7424 9.00006 24.0001 9.00006C16.8911 9.00006 10.7027 13.4774 7.14373 18.591V13.591Z" fill="#FBBC05"/>
                    <path d="M43.0564 16.5674H24.0001V31.4326H43.0564C43.6826 29.043 44.0001 26.5448 44.0001 24C44.0001 22.8447 43.8914 21.6061 43.673 20.3636L34.8258 24C35.0441 24 35.1528 22.8447 35.1528 21.6061C35.1528 19.8398 34.9084 18.0673 34.4687 16.3636H43.0564Z" fill="#EA4335"/>
                </svg>
                <span class="ml-1">使用 Google 帳號登入</span>
            </button>

            <!-- 登入資訊區塊 (登入後顯示) -->
            <div id="user-info-card" class="hidden bg-gray-50 p-4 rounded-lg border border-gray-200">
                <p class="text-sm font-semibold text-gray-700 mb-2">登入成功！</p>
                <div class="flex items-center space-x-4">
                    <img id="user-photo" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-md"
                         src="https://placehold.co/100x100/A0AEC0/ffffff?text=U" alt="使用者頭像"
                         onerror="this.onerror=null; this.src='https://placehold.co/100x100/A0AEC0/ffffff?text=U';">
                    <div class="flex-1 min-w-0">
                        <p id="user-display-name" class="text-lg font-bold text-gray-900 truncate">載入中...</p>
                        <p id="user-email" class="text-xs text-gray-500 truncate">載入中...</p>
                    </div>
                </div>
                <!-- 登出按鈕 -->
                <button id="google-signout-btn" onclick="signOutUser()"
                        class="mt-4 w-full px-4 py-2 border border-gray-300 text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                    登出
                </button>
                <div class="mt-4 p-2 bg-yellow-100 text-yellow-800 text-xs rounded break-all">
                    <span class="font-bold">用戶 ID: </span><span id="user-uid">N/A</span>
                </div>
            </div>
            
            <!-- 錯誤/訊息提示 -->
            <div id="message-box" class="hidden p-3 bg-red-100 text-red-700 text-sm rounded-lg" role="alert"></div>
        </div>
    </div>

    <!-- 載入 Firebase 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            signInWithCustomToken,
            signInAnonymously,
            onAuthStateChanged,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 設置日誌級別為調試，便於排錯
        setLogLevel('debug');

        // 檢查並使用環境提供的全域變數
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        // 原始的動態載入方式 (已被註釋)
        // const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}'); 
        
        // **使用使用者提供的 Firebase 靜態配置資料**
        const firebaseConfig = {
          apiKey: "AIzaSyDpmCMLtHDuvTWFCKSNBDLFMmdGdQfA17I",
          authDomain: "studio-4305054348-a6a5f.firebaseapp.com",
          projectId: "studio-4305054348-a6a5f",
          storageBucket: "studio-4305054348-a6a5f.firebasestorage.app",
          messagingSenderId: "278667343750",
          appId: "1:278667343750:web:71e2da24e2a1ece6f39e07"
        };
        
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // --- Firebase 初始化 ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // 雖然沒有用到 Firestore，但保持完整初始化
        const provider = new GoogleAuthProvider();

        const messageBox = document.getElementById('message-box');
        const signInBtn = document.getElementById('google-signin-btn');
        const userInfoCard = document.getElementById('user-info-card');
        const userDisplayName = document.getElementById('user-display-name');
        const userEmail = document.getElementById('user-email');
        const userPhoto = document.getElementById('user-photo');
        const userUid = document.getElementById('user-uid');
        
        /**
         * 顯示訊息
         * @param {string} msg 訊息內容
         * @param {string} type 訊息類型 ('error', 'info', 'success')
         */
        function showMessage(msg, type = 'error') {
            // 使用 textContent 確保安全地顯示純文字訊息
            messageBox.textContent = msg;
            messageBox.className = `p-3 text-sm rounded-lg mt-4 ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            messageBox.classList.remove('hidden');
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 5000);
        }

        /**
         * 根據使用者狀態更新 UI
         * @param {import("firebase/auth").User | null} user Firebase User 物件
         */
        function updateUI(user) {
            if (user && !user.isAnonymous) {
                // 已登入 (非匿名)
                signInBtn.classList.add('hidden');
                userInfoCard.classList.remove('hidden');
                
                // 顯示使用者資訊
                userDisplayName.textContent = user.displayName || '無名稱';
                userEmail.textContent = user.email || '無電子郵件';
                userPhoto.src = user.photoURL || 'https://placehold.co/100x100/A0AEC0/ffffff?text=U';
                userUid.textContent = user.uid;
            } else {
                // 未登入或匿名登入
                signInBtn.classList.remove('hidden');
                userInfoCard.classList.add('hidden');

                // 清空顯示資訊
                userDisplayName.textContent = '載入中...';
                userEmail.textContent = '載入中...';
                userPhoto.src = 'https://placehold.co/100x100/A0AEC0/ffffff?text=U';
                userUid.textContent = 'N/A';
            }
        }

        /**
         * 處理 Google 帳號登入
         */
        window.signInWithGoogle = async function() {
            try {
                // 使用 Popup 視窗進行登入
                const result = await signInWithPopup(auth, provider);
                // 登入成功後 onAuthStateChanged 會自動更新 UI
                showMessage('Google 登入成功！', 'success');
            } catch (error) {
                console.error("Google 登入失敗:", error);
                
                const errorCode = error.code;
                let displayMessage = '登入失敗，請稍後再試。';

                // *** 處理 auth/unauthorized-domain 錯誤，並顯示連結與當前網域 ***
                if (errorCode === 'auth/unauthorized-domain') {
                    const projectId = firebaseConfig.projectId;
                    const domainLink = `https://console.firebase.google.com/project/${projectId}/authentication/settings`;
                    // 獲取當前網域 (hostname)，這就是您需要加入的網域
                    const currentHostname = window.location.hostname;
                    
                    // 直接設定 innerHTML 來顯示帶有超連結的複雜訊息
                    messageBox.classList.remove('hidden');
                    messageBox.className = 'p-3 text-sm rounded-lg mt-4 bg-red-100 border border-red-500 text-red-700';
                    messageBox.innerHTML = `
                        <p class="font-bold mb-1 text-center">登入錯誤 (${errorCode}): 網域未授權</p>
                        <p class="text-sm text-center mb-2">請將此網域加入 Firebase 專案的授權網域清單：</p>
                        
                        <!-- 顯示需要加入的網域，並用 select-all 方便複製 -->
                        <div class="mt-2 p-2 bg-red-200 text-red-800 rounded font-mono text-center break-all">
                            需要加入的網域: <strong class="select-all">${currentHostname}</strong>
                        </div>

                        <p class="mt-3 text-blue-700 underline font-medium text-center">
                            <a href="${domainLink}" target="_blank" class="hover:text-blue-900">點此前往 Firebase 驗證設定頁面</a>
                        </p>
                        <p class="text-xs mt-2 break-all text-center">專案ID: ${projectId}</p>
                    `;
                    return; // 阻止後續的 showMessage 執行
                }
                
                // 處理其他常見錯誤
                if (errorCode === 'auth/popup-closed-by-user') {
                    displayMessage = '使用者已關閉登入視窗。';
                } else if (errorCode === 'auth/cancelled-popup-request') {
                    displayMessage = '登入請求被取消或已在處理中。';
                }

                // 顯示其他一般錯誤
                showMessage(`登入錯誤 (${errorCode}): ${displayMessage}`);
            }
        };

        /**
         * 處理登出
         */
        window.signOutUser = async function() {
            try {
                await signOut(auth);
                // 登出成功後 onAuthStateChanged 會自動更新 UI
                showMessage('已登出。', 'info');
            } catch (error) {
                console.error("登出失敗:", error);
                showMessage(`登出失敗: ${error.message}`);
            }
        };

        /**
         * 確保 Firebase 在 Canvas 環境中完成初始認證
         * 即使 Custom Token 失敗，也嘗試匿名登入，確保 auth 物件可用。
         */
        async function initializeAuth() {
            if (!initialAuthToken) {
                console.log("Canvas: 無初始令牌，執行匿名登入。");
                await signInAnonymously(auth);
                return;
            }

            try {
                console.log("Canvas: 嘗試使用自定義令牌登入...");
                await signInWithCustomToken(auth, initialAuthToken);
                console.log("Canvas: 自定義令牌登入成功。");
            } catch (error) {
                console.error("Canvas: 自定義令牌登入失敗:", error);
                
                // 專門處理 Custom Token Mismatch 錯誤，並回退到匿名登入
                if (error.code === 'auth/custom-token-mismatch') {
                    console.log("Canvas: 自定義令牌不匹配。回退到匿名登入。");
                    try {
                        await signInAnonymously(auth);
                        // 修正日誌訊息以更清楚地表示回退成功
                        console.log("Canvas: 自定義令牌登入失敗，已成功切換至匿名模式。");
                    } catch (anonError) {
                        console.error("Canvas: 匿名登入也失敗:", anonError);
                        // 如果匿名登入也失敗，則應用程式將無法啟動認證
                    }
                } else {
                     // 處理其他自定義令牌錯誤 (例如令牌過期等)，並嘗試回退匿名登入
                    try {
                        await signInAnonymously(auth);
                        console.log("Canvas: 其他自定義令牌錯誤。回退匿名登入成功。");
                    } catch (anonError) {
                         console.error("Canvas: 匿名登入也失敗:", anonError);
                    }
                }
            }
        }

        // 監聽認證狀態變化
        onAuthStateChanged(auth, (user) => {
            updateUI(user);
        });

        // 在頁面載入時執行初始認證
        initializeAuth();

    </script>
</body>
</html>
